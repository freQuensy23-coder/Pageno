name: Android
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
env:
  NDK_VERSION: '30.0.14904198'
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Use the runner's Android SDK
        run: |
          tools=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin | sort -V | tail -1)
          echo "$tools" >> "$GITHUB_PATH"
          yes | "$tools/sdkmanager" --licenses > /dev/null || true
      - name: Install Android SDK and NDK
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;$NDK_VERSION"
          echo "ANDROID_NDK=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - name: Install native build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake ninja-build python3-requests
      - name: Calculate native source cache key
        id: native-key
        run: |
          source_hash=$(git ls-tree -r HEAD -- build_dependencies.py build_dependencies PdfiumAndroid/src/main/jni | sha256sum | cut -d ' ' -f 1)
          echo "key=native-$RUNNER_OS-$NDK_VERSION-$source_hash" >> "$GITHUB_OUTPUT"
      - name: Cache native libraries
        id: native-cache
        uses: actions/cache@v4
        with:
          path: PdfiumAndroid/src/main/libs
          key: ${{ steps.native-key.outputs.key }}
      - name: Build native libraries for all four ABIs
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p PdfiumAndroid/src/main/jni/lib/{arm64-v8a,armeabi-v7a,x86,x86_64}
          python3 build_dependencies.py --pdfium prebuilt
      - name: Verify native runtime is present
        run: |
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            for lib in libjniPdfium.so libmodpdfium.so libmodft2.so libmodpng.so libc++_shared.so; do
              test -s "PdfiumAndroid/src/main/libs/$abi/$lib"
            done
          done
      - name: Test native build tooling
        run: python3 -m unittest build_dependencies.test_downloads
      - name: Build APKs, run unit tests and lint
        run: bash ./gradlew --no-daemon --stacktrace --max-workers=2 -Dorg.gradle.jvmargs=-Xmx4g assembleDebug assembleRelease testDebugUnitTest lintDebug
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Pageno-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload caller test APK
        uses: actions/upload-artifact@v4
        with:
          name: intent-caller
          path: ci/intent-caller/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Upload unsigned release APKs
        uses: actions/upload-artifact@v4
        with:
          name: Pageno-release-unsigned
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
  task-smoke:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: Pageno-debug
          path: apk
      - uses: actions/download-artifact@v4
        with:
          name: intent-caller
          path: caller-apk
      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: python3 ci/task_smoke.py
      - name: Upload task test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task-smoke-results
          path: task-smoke-results/
          if-no-files-found: warn
  telegram-e2e:
    uses: ./.github/workflows/telegram-e2e.yml

  # Every push to main (and every v* tag) publishes a signed release after all tests pass.
  release:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [build, task-smoke, telegram-e2e]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: Pageno-release-unsigned
          path: unsigned
      - name: Sign APKs with the Pageno release key
        env:
          KEYSTORE_B64: ${{ secrets.PAGENO_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.PAGENO_KEYSTORE_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "PAGENO_KEYSTORE_B64 secret is missing"; exit 1; }
          version=$(sed -n 's/.*versionName "\(.*\)"/\1/p' app/build.gradle)
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          mkdir release
          for apk in unsigned/*.apk; do
            abi=$(basename "$apk" | sed -E 's/^app-(.*)-release-unsigned\.apk$/\1/')
            "$apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-pass env:KEYSTORE_PASSWORD \
              --ks-key-alias pageno --out "release/Pageno-$version-$abi.apk" "$apk"
            "$apksigner" verify "release/Pageno-$version-$abi.apk"
          done
          rm "$RUNNER_TEMP/release.jks"
          cd release && sha256sum ./*.apk > SHA256SUMS
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag="$GITHUB_REF_NAME"; target=()
          else
            tag="v$VERSION-build.$GITHUB_RUN_NUMBER"; target=(--target "$GITHUB_SHA")
          fi
          cat > release-notes.md <<EOF
          Pageno $VERSION, built from ${GITHUB_SHA::7}. Signed with the Pageno release key.
          Install **Pageno-$VERSION-universal.apk** (or the arm64-v8a one for modern phones).
          Passed: unit tests, lint, task-smoke, and the Telegram end-to-end test (PDFs open in their own task).
          Pageno is a fork of MJ PDF; source and license are in the repository.
          EOF
          gh release create "$tag" release/*.apk release/SHA256SUMS "${target[@]}" --latest \
            --title "Pageno $VERSION (build $GITHUB_RUN_NUMBER)" --notes-file release-notes.md
