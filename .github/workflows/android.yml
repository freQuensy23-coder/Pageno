name: Android
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
env:
  NDK_VERSION: '30.0.14904198'
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK and NDK
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;$NDK_VERSION"
          echo "ANDROID_NDK=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - name: Install native build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake ninja-build python3-requests
      - name: Cache native libraries
        id: native-cache
        uses: actions/cache@v4
        with:
          path: PdfiumAndroid/src/main/libs
          key: native-${{ runner.os }}-${{ env.NDK_VERSION }}-${{ hashFiles('build_dependencies.py', 'build_dependencies/**', 'PdfiumAndroid/src/main/jni/**') }}
      - name: Build native libraries for all four ABIs
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p PdfiumAndroid/src/main/jni/lib/{arm64-v8a,armeabi-v7a,x86,x86_64}
          python3 build_dependencies.py --pdfium prebuilt
      - name: Verify native runtime is present
        run: |
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            for lib in libjniPdfium.so libmodpdfium.so libmodft2.so libmodpng.so libc++_shared.so; do
              test -s "PdfiumAndroid/src/main/libs/$abi/$lib"
            done
          done
      - name: Test native build tooling
        run: python3 -m unittest build_dependencies.test_downloads
      - name: Build APKs, run unit tests and lint
        run: bash ./gradlew --no-daemon --stacktrace --max-workers=2 -Dorg.gradle.jvmargs=-Xmx4g assembleDebug assembleRelease testDebugUnitTest lintDebug
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Pageno-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload unsigned release APKs
        uses: actions/upload-artifact@v4
        with:
          name: Pageno-release-unsigned
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Pageno-release-unsigned
          path: release
      - name: Prepare checksums and release notes
        run: |
          cd release
          sha256sum ./*.apk > SHA256SUMS
          cat > ../release-notes.md <<'EOF'
          Pageno fork of MJ PDF. These release APKs are UNSIGNED and must be signed with the project's release keystore before installation/distribution.
          Source code and license are available in the repository at this tag. CI uses the upstream pinned prebuilt PDFium and rebuilds the JNI bridge, FreeType and libpng.
          EOF
      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" release/*.apk release/SHA256SUMS --verify-tag --draft --title "Pageno $RELEASE_TAG" --notes-file release-notes.md
