name: Telegram E2E
# Opens a PDF from the official Telegram app on an Android 16 emulator and checks that Pageno
# shows it in its own task. The same test also runs against a known-bad build and must catch it.
# Called by android.yml; a release is published only if this passes.
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
env:
  NDK_VERSION: '30.0.14904198'
jobs:
  apk:
    strategy:
      matrix:
        include:
          - label: head
            ref: ''
          # Last commit before the singleInstancePerTask fix. Telegram PDFs open inside
          # Telegram's task in this build. Kept as a negative control.
          - label: known-bad
            ref: c3057265c12f9c2f538a0c4bcdbabb73edd06d07
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ matrix.ref }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Use the runner's Android SDK
        run: |
          tools=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin | sort -V | tail -1)
          echo "$tools" >> "$GITHUB_PATH"
          yes | "$tools/sdkmanager" --licenses > /dev/null || true
      - name: Install Android SDK and NDK
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;$NDK_VERSION"
          echo "ANDROID_NDK=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - name: Install native build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake ninja-build python3-requests
      - name: Calculate native source cache key
        id: native-key
        run: |
          source_hash=$(git ls-tree -r HEAD -- build_dependencies.py build_dependencies PdfiumAndroid/src/main/jni | sha256sum | cut -d ' ' -f 1)
          echo "key=native-$RUNNER_OS-$NDK_VERSION-$source_hash" >> "$GITHUB_OUTPUT"
      - name: Cache native libraries
        id: native-cache
        uses: actions/cache@v4
        with:
          path: PdfiumAndroid/src/main/libs
          key: ${{ steps.native-key.outputs.key }}
      - name: Build native libraries
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p PdfiumAndroid/src/main/jni/lib/{arm64-v8a,armeabi-v7a,x86,x86_64}
          python3 build_dependencies.py --pdfium prebuilt
      # The E2E runs the minified release build, the one that is shipped.
      - name: Build release APK
        run: bash ./gradlew --no-daemon --stacktrace --max-workers=2 -Dorg.gradle.jvmargs=-Xmx4g :app:assembleRelease
      - name: Sign the universal APK with a throwaway test key
        run: |
          mkdir -p e2e-apk
          keytool -genkeypair -keystore e2e.jks -storepass android -keypass android -alias e2e \
            -dname "CN=Pageno E2E" -keyalg RSA -validity 2
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign --ks e2e.jks --ks-pass pass:android \
            --out e2e-apk/Pageno-universal-release.apk app/build/outputs/apk/release/*universal*-unsigned.apk
          git log -1 --format='%H %s' > e2e-apk/SOURCE.txt
      - uses: actions/upload-artifact@v4
        with:
          name: pageno-${{ matrix.label }}
          path: e2e-apk/
          if-no-files-found: error
          retention-days: 14

  telegram:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Use the runner's Android SDK
        run: |
          tools=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin | sort -V | tail -1)
          echo "$tools" >> "$GITHUB_PATH"
          yes | "$tools/sdkmanager" --licenses > /dev/null || true
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Download official Telegram and build the instrumentation
        run: python3 ci/e2e/prepare_telegram.py telegram-work
      - uses: actions/upload-artifact@v4
        with:
          name: telegram-work
          path: |
            telegram-work/*.apk
            telegram-work/*.txt
            telegram-work/*.json
          retention-days: 14

  e2e:
    needs: [apk, telegram]
    strategy:
      fail-fast: false
      matrix:
        include:
          - device: phone
            profile: pixel_6
          - device: tablet
            profile: pixel_c
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: pageno-*
      - uses: actions/download-artifact@v4
        with:
          name: telegram-work
          path: telegram-work
      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: ${{ matrix.profile }}
          ram-size: 4096M
          disable-animations: true
          script: bash ci/e2e/emulator_suite.sh telegram-e2e-results/${{ matrix.device }}
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: telegram-e2e-${{ matrix.device }}
          path: telegram-e2e-results/
          retention-days: 30
